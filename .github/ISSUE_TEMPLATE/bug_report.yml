name: Bug Report
description: Report something that doesn't work
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash, or the release you installed.
    validations:
      required: true
  - type: input
    id: machines
    attributes:
      label: Machines involved
      description: OS and version of the server and of each client, e.g. "server Windows 11 24H2, client macOS 15".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run with `--debug DEBUG` if you can.
      render: shell
    validations:
      required: false
